name: release

# Pushing a tag like v0.1.0 builds a universal macOS binary and publishes it
# as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build universal binary
        run: |
          for arch in arm64 amd64; do
            CGO_ENABLED=1 GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "claude-limits-$arch" .
          done
          lipo -create -output claude-limits claude-limits-arm64 claude-limits-amd64
          codesign --force -s - claude-limits
          zip "claude-limits-${GITHUB_REF_NAME}-macos-universal.zip" claude-limits
          shasum -a 256 claude-limits-*.zip > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            claude-limits-*.zip SHA256SUMS
